name: CSDV
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # Core notebook / dev
  - jupyterlab
  - notebook
  - jupyter
  - ipykernel
  - ipywidgets
  - ipyleaflet
  - pandoc

  # Core science / ML
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - scikit-image
  - numba
  - matplotlib
  - xarray
  - dask
  - netcdf4

  # Vector / raster geospatial
  - geopandas
  - pyogrio
  - gdal
  - fiona
  - rasterio
  - rioxarray
  - shapely
  - pyproj
  - cartopy
  - folium

  # Point cloud / lidar
  - laspy

  # R and lidR for the lidR reference crown engine (naipcrowns.lidr runs
  # naipcrowns/data/crown_segmentation.R through Rscript) and the Indiana
  # tuning study's lidR checks (scripts/segmentation/compare_r.py).
  - r-base
  - r-lidr
  - r-terra
  - r-sf


  # Topographic analysis (Phase 4 stratification)
  - richdem

  # Imagery search and access (Microsoft Planetary Computer)
  - pystac-client
  - planetary-computer

  # Tabular caches (stand metrics, satellite observations) are written as
  # parquet, which pandas cannot do without an engine.
  - pyarrow

  # Off-screen 3D renders of height surfaces (csdv_core.viz.scene3d)
  - pyvista

  # Tests and formatting, from conda-forge so they run with this env's Python.
  # scripts/chpc/create_env.sh installs the package with --no-deps, so the
  # [dev] extra is not used there.
  - pytest
  - black
  - ruff

  # NAIP-CHM inference dependencies (smorf-ntsg/naip-chm requirements.txt).
  # PyTorch itself is installed from the CUDA pip wheels by
  # scripts/chpc/create_env.sh, not from conda.
  - rio-cogeo
  - tensorboard

  # Interactive map viewer (src/rsviewer): leafmap on the ipyleaflet backend,
  # local COG tiles through localtileserver, Earth Engine layers through
  # geemap, and Plotly FigureWidget panels (which need anywidget).
  - leafmap
  - localtileserver
  - geemap
  - plotly
  - anywidget
  - xyzservices
  # Browser app for interpreting detected disturbances (csdv review app,
  # src/csdv_core/review). Installed locally with pip because the micromamba
  # solver ran out of memory; the wheels touch no compiled geospatial library.
  - solara

  # Nice extras for this kind of project
  - requests
  - tqdm
  - openpyxl
  - xlrd

  - pip:
      - streamlit-folium
      # Earth Engine backs the satellite metric extraction (csdv_core.satellite)
      # and the NAIP / NAIP-CHM downloaders. wxee provides the .wx accessor the
      # image exporters use. Both are pip-only.
      - earthengine-api
      - wxee




      